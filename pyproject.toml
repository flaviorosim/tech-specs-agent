[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-specs-agent"
version = "0.1.0"
description = "Agentic RAG system for technical hardware documentation"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.26,<2.0",
    "requests>=2.32,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

retrieval = [
    "rank-bm25>=0.2.2,<1",
]

vectors = [
    "qdrant-client>=1.15,<2",
    "fastembed>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "pdf: tests using real technical PDF documents",
]